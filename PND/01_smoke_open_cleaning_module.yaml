# SMOKE - Login, open HACCP home, open Cleaning and disinfection planning.
appId: com.mycawan.haccp.preprod
name: "C&D 01 - Open Cleaning and disinfection planning"
tags: [smoke, regression, cleaning]
env:
  USER_NAME: ${USER_NAME || "Antoine.*GRIEZMANN"}
  USER_PIN: ${USER_PIN || "1234"}
---
- runFlow: subflows/login.yaml
- assertVisible: "Brasserie des 3 Horloges.*"
- assertVisible: "Equipment.*temperatures"
- assertVisible: "Cleaning and.*disinfection planning"
- runFlow: subflows/open_cleaning_module.yaml
- assertVisible: "D-1"
- assertVisible: "More actions"
- assertVisible: "Position\nMoment"
- takeScreenshot: "screenshots/cd01_planning"
# Back to HACCP home through the grid icon
- tapOn: "Back icon"
- extendedWaitUntil:
    visible: "mycawan HACCP"
    timeout: 8000
