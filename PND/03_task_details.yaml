# REGRESSION - Tap a task name, check the "Task details" dialog, close it.
appId: com.mycawan.haccp.preprod
name: "C&D 03 - Task details dialog"
tags: [regression, cleaning, non-destructive]
env:
  USER_NAME: ${USER_NAME || "Antoine.*GRIEZMANN"}
  USER_PIN: ${USER_PIN || "1234"}
  TASK: ${TASK || "BRULEURS"}
---
- runFlow: subflows/login.yaml
- runFlow: subflows/open_cleaning_module.yaml
- runFlow: subflows/locate_task.yaml
- tapOn: ${TASK}
- extendedWaitUntil:
    visible: "Task details"
    timeout: 8000
- assertVisible: "Description"
- assertVisible: "Documents"
- assertVisible:
    text: ${TASK}
    below: "Task details"
- takeScreenshot: "screenshots/cd03_task_details"
- tapOn: "Close icon"
- extendedWaitUntil:
    notVisible: "Task details"
    timeout: 5000
- assertVisible: "Day of.*"
