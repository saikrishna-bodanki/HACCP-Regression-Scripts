# REGRESSION - Switch between D-1 and Today tabs.
appId: com.mycawan.haccp.preprod
name: "C&D 02 - D-1 / Today tabs"
tags: [smoke, regression, cleaning]
env:
  USER_NAME: ${USER_NAME || "Antoine.*GRIEZMANN"}
  USER_PIN: ${USER_PIN || "1234"}
---
- runFlow: subflows/login.yaml
- runFlow: subflows/open_cleaning_module.yaml
- tapOn: "D-1"
- waitForAnimationToEnd
- assertVisible: "Day of.*"
- assertVisible: "Tasks"
- takeScreenshot: "screenshots/cd02_d1"
- tapOn: "Today"
- waitForAnimationToEnd
- assertVisible: "Day of.*"
- takeScreenshot: "screenshots/cd02_today"
