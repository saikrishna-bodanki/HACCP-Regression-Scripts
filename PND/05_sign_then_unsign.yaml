# REGRESSION - Sign a task, open "Signing cancellation", Cancel (stays signed),
# then Confirm (back to unsigned). Leaves the data as it found it.
appId: com.mycawan.haccp.preprod
name: "C&D 05 - Sign then unsign (cancel + confirm)"
tags: [regression, cleaning, non-destructive]
env:
  USER_NAME: ${USER_NAME || "Antoine.*GRIEZMANN"}
  USER_PIN: ${USER_PIN || "1234"}
  TASK: ${TASK || "FRIGO CUISINE"}
---
- runFlow: subflows/login.yaml
- runFlow: subflows/open_cleaning_module.yaml
- runFlow: subflows/sign_task.yaml

# Cancel keeps the signature
- runFlow:
    file: subflows/unsign_task.yaml
    env:
      DECISION: "Cancel"
- runFlow:
    file: subflows/assert_row.yaml
    env:
      TARGET: "undo icon"
      EXPECTED: "1"

# Confirm removes it
- runFlow:
    file: subflows/unsign_task.yaml
    env:
      DECISION: "Confirm"
- runFlow:
    file: subflows/assert_row.yaml
    env:
      TARGET: "Sign"
      EXPECTED: "1"
- takeScreenshot: "screenshots/cd05_unsigned"
