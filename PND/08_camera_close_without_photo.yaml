# REGRESSION (negative) - Open the camera from a signed task and close it without
# shooting: no photo must be attached. Leaves data clean (unsigns at the end).
appId: com.mycawan.haccp.preprod
name: "C&D 08 - Camera closed without photo"
tags: [regression, cleaning, non-destructive, negative]
env:
  USER_NAME: ${USER_NAME || "Antoine.*GRIEZMANN"}
  USER_PIN: ${USER_PIN || "1234"}
  TASK: ${TASK || "FRIGO CUISINE"}
---
- runFlow: subflows/login.yaml
- runFlow: subflows/open_cleaning_module.yaml
- runFlow: subflows/sign_task.yaml
- runFlow:
    file: subflows/tap_in_row.yaml
    env:
      TARGET: "icon"
      OFFSET: "2"
- extendedWaitUntil:
    visible:
      id: "com.mycawan.haccp.preprod:id/llTakePictureBtn"
    timeout: 10000
- tapOn:
    id: "com.mycawan.haccp.preprod:id/ivClose"
- extendedWaitUntil:
    visible: "Day of.*"
    timeout: 8000
# Tapping the camera again must open the camera (no photo stored), not the viewer
- runFlow:
    file: subflows/tap_in_row.yaml
    env:
      TARGET: "icon"
      OFFSET: "2"
- extendedWaitUntil:
    visible:
      id: "com.mycawan.haccp.preprod:id/llTakePictureBtn"
    timeout: 10000
- tapOn:
    id: "com.mycawan.haccp.preprod:id/ivClose"
- extendedWaitUntil:
    visible: "Day of.*"
    timeout: 8000
# Cleanup
- runFlow:
    file: subflows/unsign_task.yaml
    env:
      DECISION: "Confirm"
