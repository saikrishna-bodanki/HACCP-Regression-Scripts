# From the HACCP home, opens Equipment temperatures > ${MODULE}.
# env: MODULE ("Cold equipments" | "Hot equipments")
appId: com.mycawan.haccp.preprod
---
- runFlow:
    when:
      notVisible: "mycawan HACCP"
    commands:
      - tapOn:
          id: "com.mycawan.haccp.preprod:id/llHomeClick"
          optional: true
      - extendedWaitUntil:
          visible: "mycawan HACCP"
          timeout: 10000
- tapOn: "Equipment.*temperatures"
- extendedWaitUntil:
    visible: "Equipment temperatures"
    timeout: 5000
- assertVisible: "Cold equipments"
- assertVisible: "Hot equipments"
- tapOn: ${MODULE}
- extendedWaitUntil:
    visible:
      id: "com.mycawan.haccp.preprod:id/tvTitle"
      text: ${MODULE}
    timeout: 10000
