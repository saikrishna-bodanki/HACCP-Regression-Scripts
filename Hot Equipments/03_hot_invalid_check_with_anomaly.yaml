# REGRESSION (non-conformity) - Hot equipment out of range -> "Invalid temperature",
# anomaly management (Setting / Repair / Other) + comment, validate.
# DESTRUCTIVE: adds a non-compliant check.
appId: com.mycawan.haccp.preprod
name: "HOT 03 - Hot invalid check + anomaly management"
tags: [regression, negative, destructive, hot]
env:
  USER_NAME: ${USER_NAME || "Antoine.*GRIEZMANN"}
  USER_PIN: ${USER_PIN || "1234"}
  EQUIPMENT: ${EQUIPMENT || "Bain Remise en T°"}
  TEMP: ${TEMP || "70"}
  ANOMALY: ${ANOMALY || "Repair"}
  COMMENT: ${COMMENT || "Maestro regression - heating element repaired"}
---
- runFlow: subflows/login.yaml
- runFlow:
    file: subflows/open_equipment_module.yaml
    env:
      MODULE: "Hot equipments"
- runFlow: subflows/hot_start_check.yaml
- tapOn:
    id: "com.mycawan.haccp.preprod:id/fetTemp"
- runFlow: subflows/enter_temperature.yaml
- extendedWaitUntil:
    visible: "Invalid temperature"
    timeout: 5000
- assertVisible: "Anomaly management"
- assertVisible: "Setting"
- assertVisible: "Repair"
- assertVisible: "Other"
- tapOn: ${ANOMALY}
- assertVisible:
    id: "com.mycawan.haccp.preprod:id/tvText"
    text: ${ANOMALY}
    selected: true
- tapOn:
    id: "com.mycawan.haccp.preprod:id/fetComment"
- extendedWaitUntil:
    visible:
      id: "com.mycawan.haccp.preprod:id/etValue"
    timeout: 5000
- inputText: ${COMMENT}
- hideKeyboard
- tapOn:
    id: "com.mycawan.haccp.preprod:id/btnSave"
- assertVisible: ${COMMENT}
- takeScreenshot: "screenshots/eq08_hot_invalid"
- tapOn:
    id: "com.mycawan.haccp.preprod:id/flBtnValid"
    enabled: true
- extendedWaitUntil:
    visible: "List of temperature checks.*"
    timeout: 8000
- assertVisible:
    id: "com.mycawan.haccp.preprod:id/tvTemp"
    text: "\\+${TEMP}\\.0°C"
