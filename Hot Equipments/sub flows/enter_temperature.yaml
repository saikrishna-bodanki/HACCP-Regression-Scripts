# Types ${TEMP} on the in-app numeric keypad ("Provide the temperature") and validates.
# Assumes the keypad dialog is open. env: TEMP (e.g. "3.5", "-18", "86")
appId: com.mycawan.haccp.preprod
---
- extendedWaitUntil:
    visible:
      id: "com.mycawan.haccp.preprod:id/llNumPad"
    timeout: 5000
# Validate is disabled while the value is empty
- assertVisible:
    id: "com.mycawan.haccp.preprod:id/buttonOk"
    enabled: false
- evalScript: ${output.tIdx = 0}
- repeat:
    times: ${TEMP.length}
    commands:
      # "." must be escaped because Maestro text matching is a regex -> "[.]"
      - evalScript: ${output.key = TEMP.charAt(output.tIdx).replace('.', '[.]')}
      - tapOn:
          id: "com.mycawan.haccp.preprod:id/btn"
          text: ${output.key}
          label: "Keypad key"
      - evalScript: ${output.tIdx = output.tIdx + 1}
- tapOn:
    id: "com.mycawan.haccp.preprod:id/buttonOk"
    enabled: true
- extendedWaitUntil:
    notVisible:
      id: "com.mycawan.haccp.preprod:id/llNumPad"
    timeout: 5000
