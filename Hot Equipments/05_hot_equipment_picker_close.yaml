# REGRESSION (negative) - "Add an operation" picker can be closed without creating a check.
appId: com.mycawan.haccp.preprod
name: "HOT 05 - Hot equipment picker close"
tags: [regression, non-destructive, negative, hot]
env:
  USER_NAME: ${USER_NAME || "Antoine.*GRIEZMANN"}
  USER_PIN: ${USER_PIN || "1234"}
---
- runFlow: subflows/login.yaml
- runFlow:
    file: subflows/open_equipment_module.yaml
    env:
      MODULE: "Hot equipments"
- tapOn:
    id: "com.mycawan.haccp.preprod:id/btnAdd"
- extendedWaitUntil:
    visible: "Select the equipment to check"
    timeout: 5000
- assertVisible:
    id: "com.mycawan.haccp.preprod:id/ibSearch"
- tapOn:
    id: "com.mycawan.haccp.preprod:id/tvDialogTitleIconClose"
- extendedWaitUntil:
    notVisible: "Select the equipment to check"
    timeout: 5000
- assertVisible: "List of temperature checks.*"
- assertNotVisible: "Hot equipment check details"
