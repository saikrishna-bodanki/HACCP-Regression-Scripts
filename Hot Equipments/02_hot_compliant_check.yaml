# REGRESSION - Hot equipment: add an operation with an in-range temperature,
# "Compliant result", validate, check appears in today's list.
# DESTRUCTIVE: adds a check (use E09 to see deletion).
appId: com.mycawan.haccp.preprod
name: "HOT 02 - Hot compliant check"
tags: [smoke, regression, destructive, hot]
env:
  USER_NAME: ${USER_NAME || "Antoine.*GRIEZMANN"}
  USER_PIN: ${USER_PIN || "1234"}
  EQUIPMENT: ${EQUIPMENT || "Bain Remise en T°"}
  TEMP: ${TEMP || "86"}
---
- runFlow: subflows/login.yaml
- runFlow:
    file: subflows/open_equipment_module.yaml
    env:
      MODULE: "Hot equipments"
- runFlow: subflows/hot_start_check.yaml
- tapOn:
    id: "com.mycawan.haccp.preprod:id/fetTemp"
- runFlow: subflows/enter_temperature.yaml
- extendedWaitUntil:
    visible: "Compliant result"
    timeout: 5000
- assertNotVisible: "Anomaly management"
- assertVisible:
    id: "com.mycawan.haccp.preprod:id/flBtnDelete"
- takeScreenshot: "screenshots/eq07_hot_ok"
- tapOn:
    id: "com.mycawan.haccp.preprod:id/flBtnValid"
    enabled: true
- extendedWaitUntil:
    visible: "List of temperature checks.*"
    timeout: 8000
- assertVisible:
    id: "com.mycawan.haccp.preprod:id/tvTemp"
    text: "\\+${TEMP}\\.0°C"
