# REGRESSION - Open an out-of-tolerance calibration record, bring it back to 0°C (compliant),
# Validate: the list has one non-zero (non-compliant) record less.
# Needs at least one non-zero record (run CAL 04 first).
appId: com.mycawan.haccp.preprod
name: "CAL 05 - Edit calibration record"
tags: [regression, calibration, destructive]
env:
  USER_NAME: ${USER_NAME || "Antoine.*GRIEZMANN"}
  USER_PIN: ${USER_PIN || "1234"}
---
- runFlow: subflows/login.yaml
- runFlow: subflows/open_calibration_module.yaml

# Count records whose value is not 0.0 (e.g. "1.5", "-1.5", "0.3")
- evalScript: ${output.before = 0}
- repeat:
    times: 30
    while:
      visible:
        text: "-?[1-9][0-9]*\\.[0-9]|-?0\\.[1-9]"
        index: ${output.before}
    commands:
      - evalScript: ${output.before = output.before + 1}
- assertTrue:
    condition: ${output.before > 0}
    label: "At least one non-compliant calibration record exists"

# Open the first non-zero record
- tapOn:
    text: "-?[1-9][0-9]*\\.[0-9]|-?0\\.[1-9]"
    index: 0
- extendedWaitUntil:
    visible: "Calibration - .*"
    timeout: 8000
# Saved values are reloaded
- assertVisible: "Invalid temperature|Compliant result"
- assertVisible: "Calibration"
- takeScreenshot: "screenshots/cal05_before_edit"

# Drag from anywhere on the track to the middle -> 0°C
- swipe:
    start: "80%, 49%"
    end: "50%, 49%"
    duration: 800
- runFlow:
    when:
      notVisible: "0°C"
    commands:
      - swipe:
          start: "20%, 49%"
          end: "50%, 49%"
          duration: 800
- assertVisible: "Compliant result"
- assertVisible: "0°C"
- tapOn: "Validate"
- extendedWaitUntil:
    visible: "Calibration of equipments"
    timeout: 8000

- evalScript: ${output.after = 0}
- repeat:
    times: 30
    while:
      visible:
        text: "-?[1-9][0-9]*\\.[0-9]|-?0\\.[1-9]"
        index: ${output.after}
    commands:
      - evalScript: ${output.after = output.after + 1}
- assertTrue:
    condition: ${output.after == output.before - 1}
    label: "Edited record is now compliant"
