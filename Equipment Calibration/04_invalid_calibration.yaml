# REGRESSION (non-conformity) - Drag the slider out of tolerance -> "Invalid temperature",
# Validate -> record listed as non-compliant.
# DESTRUCTIVE: adds a calibration record.
appId: com.mycawan.haccp.preprod
name: "CAL 04 - Invalid calibration"
tags: [regression, calibration, negative, destructive]
env:
  USER_NAME: ${USER_NAME || "Antoine.*GRIEZMANN"}
  USER_PIN: ${USER_PIN || "1234"}
  EQUIPMENT: ${EQUIPMENT || "Thermomètre A"}
  METHOD: ${METHOD || "Etalon"}
  SLIDER: ${SLIDER || "plus"}
  COMMENT: ${COMMENT || "Maestro regression - out of tolerance"}
---
- runFlow: subflows/login.yaml
- runFlow: subflows/open_calibration_module.yaml
- runFlow: subflows/start_calibration.yaml
- runFlow: subflows/fill_calibration.yaml
- assertVisible: "Invalid temperature"
- assertNotVisible: "Compliant result"
- assertVisible: "[+-][0-9]+\\.[0-9]°C"
- takeScreenshot: "screenshots/cal04_invalid"
- tapOn: "Validate"
- extendedWaitUntil:
    visible: "Calibration of equipments"
    timeout: 8000
- assertVisible: ${EQUIPMENT}
