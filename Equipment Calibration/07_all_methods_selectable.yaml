# REGRESSION - Every calibration method can be selected and enables the calibration slider.
# Leaves with Back, nothing saved.
appId: com.mycawan.haccp.preprod
name: "CAL 07 - All methods selectable"
tags: [regression, calibration, non-destructive]
env:
  USER_NAME: ${USER_NAME || "Antoine.*GRIEZMANN"}
  USER_PIN: ${USER_PIN || "1234"}
  EQUIPMENT: ${EQUIPMENT || "Thermomètre numérique"}
---
- runFlow: subflows/login.yaml
- runFlow: subflows/open_calibration_module.yaml
- runFlow: subflows/start_calibration.yaml
- tapOn: "Eau / Glace"
- assertVisible: "Calibration"
- assertVisible: "0°C"
- tapOn: "Etalon"
- assertVisible: "Calibration"
- tapOn: "Poids de référence"
- assertVisible: "Calibration"
# Validate is no longer disabled once a method is chosen
- assertNotVisible:
    containsChild: "Validate"
    enabled: false
- takeScreenshot: "screenshots/cal07_methods"
- tapOn:
    id: "com.mycawan.haccp.preprod:id/llBackClick"
- extendedWaitUntil:
    visible: "Calibration of equipments"
    timeout: 5000
