# From the HACCP home, opens "Equipment calibration" (list "Calibration of equipments").
appId: com.mycawan.haccp.preprod
---
- runFlow:
    when:
      notVisible: "mycawan HACCP"
    commands:
      - tapOn:
          id: "com.mycawan.haccp.preprod:id/llHomeClick"
          optional: true
      - extendedWaitUntil:
          visible: "mycawan HACCP"
          timeout: 10000
- scrollUntilVisible:
    element: "Equipment calibration"
    direction: DOWN
    timeout: 10000
- tapOn: "Equipment calibration"
- extendedWaitUntil:
    visible: "Calibration of equipments"
    timeout: 10000
- assertVisible:
    id: "com.mycawan.haccp.preprod:id/tvTitle"
    text: "Equipment calibration"
- assertVisible: "Add an operation"
