# REGRESSION (negative) - Without a method the slider is hidden and Validate does nothing;
# leaving with Back saves nothing.
appId: com.mycawan.haccp.preprod
name: "CAL 02 - Validate blocked without method"
tags: [regression, calibration, negative, non-destructive]
env:
  USER_NAME: ${USER_NAME || "Antoine.*GRIEZMANN"}
  USER_PIN: ${USER_PIN || "1234"}
  EQUIPMENT: ${EQUIPMENT || "Thermomètre cheap"}
---
- runFlow: subflows/login.yaml
- runFlow: subflows/open_calibration_module.yaml
- runFlow: subflows/start_calibration.yaml
- assertNotVisible: "Compliant result"
- assertNotVisible: "Invalid temperature"
- assertNotVisible: "°C"
- assertVisible:
    containsChild: "Validate"
    enabled: false
- tapOn:
    text: "Validate"
    retryTapIfNoChange: false
# Still on the form: nothing was submitted
- assertVisible: "Calibration - ${EQUIPMENT}"
- takeScreenshot: "screenshots/cal02_blocked"
- tapOn:
    id: "com.mycawan.haccp.preprod:id/llBackClick"
- extendedWaitUntil:
    visible: "Calibration of equipments"
    timeout: 5000
