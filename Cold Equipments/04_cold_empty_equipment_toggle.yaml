# REGRESSION - "This cold equipment is currently empty" locks the temperature field;
# unticking unlocks it again. Leaves the equipment as it found it.
appId: com.mycawan.haccp.preprod
name: "COLD 04 - Cold 'currently empty' checkbox"
tags: [regression, non-destructive, cold]
env:
  USER_NAME: ${USER_NAME || "Antoine.*GRIEZMANN"}
  USER_PIN: ${USER_PIN || "1234"}
  EQUIPMENT: ${EQUIPMENT || "Stockage DEMO"}
---
- runFlow: subflows/login.yaml
- runFlow:
    file: subflows/open_equipment_module.yaml
    env:
      MODULE: "Cold equipments"
- runFlow: subflows/cold_open_equipment.yaml
- evalScript: ${output.wasChecked = false}
- runFlow:
    when:
      visible:
        id: "com.mycawan.haccp.preprod:id/cbNoData"
        checked: true
    commands:
      - evalScript: ${output.wasChecked = true}
      - tapOn:
          id: "com.mycawan.haccp.preprod:id/cbNoData"
- tapOn:
    id: "com.mycawan.haccp.preprod:id/cbNoData"
- assertVisible:
    id: "com.mycawan.haccp.preprod:id/cbNoData"
    checked: true
# Temperature field is locked: tapping it must NOT open the keypad
- tapOn:
    id: "com.mycawan.haccp.preprod:id/fet_mercury_temp"
- assertNotVisible:
    id: "com.mycawan.haccp.preprod:id/llNumPad"
- takeScreenshot: "screenshots/eq04_empty"
- tapOn:
    id: "com.mycawan.haccp.preprod:id/cbNoData"
- assertVisible:
    id: "com.mycawan.haccp.preprod:id/cbNoData"
    checked: false
# Restore the original state
- runFlow:
    when:
      true: ${output.wasChecked == true}
    commands:
      - tapOn:
          id: "com.mycawan.haccp.preprod:id/cbNoData"
