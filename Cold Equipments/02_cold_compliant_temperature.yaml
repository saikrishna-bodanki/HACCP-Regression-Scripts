# REGRESSION - Cold equipment: record an in-range temperature -> "Température conforme",
# value shown in the list. Re-runnable (the reading is simply overwritten).
appId: com.mycawan.haccp.preprod
name: "COLD 02 - Cold compliant temperature"
tags: [smoke, regression, cold]
env:
  USER_NAME: ${USER_NAME || "Antoine.*GRIEZMANN"}
  USER_PIN: ${USER_PIN || "1234"}
  EQUIPMENT: ${EQUIPMENT || "Chambre positive"}
  TEMP: ${TEMP || "3.5"}
---
- runFlow: subflows/login.yaml
- runFlow:
    file: subflows/open_equipment_module.yaml
    env:
      MODULE: "Cold equipments"
- runFlow: subflows/cold_open_equipment.yaml
- runFlow: subflows/cold_record_temperature.yaml
- extendedWaitUntil:
    visible: "Température conforme"
    timeout: 5000
- assertVisible:
    id: "com.mycawan.haccp.preprod:id/tvValue"
    text: "\\+?${TEMP}°C"
- assertNotVisible: "Invalid temperature"
- assertNotVisible: "Create the anomaly"
- takeScreenshot: "screenshots/eq02_cold_ok"
- tapOn:
    id: "com.mycawan.haccp.preprod:id/llBackClick"
- extendedWaitUntil:
    visible: "List of cold equipments.*"
    timeout: 5000
- assertVisible: "\\+?${TEMP}°C"
