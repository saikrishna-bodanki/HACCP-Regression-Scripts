# SMOKE - Equipment temperatures > Cold equipments list; chooser can be dismissed.
appId: com.mycawan.haccp.preprod
name: "COLD 01 - Open Cold equipments"
tags: [smoke, regression, non-destructive, cold]
env:
  USER_NAME: ${USER_NAME || "Antoine.*GRIEZMANN"}
  USER_PIN: ${USER_PIN || "1234"}
---
- runFlow: subflows/login.yaml
# The Equipment temperatures chooser can be closed
- tapOn: "Equipment.*temperatures"
- extendedWaitUntil:
    visible: "Cold equipments"
    timeout: 5000
- tapOn: "Close icon"
- extendedWaitUntil:
    notVisible: "Cold equipments"
    timeout: 5000
- runFlow:
    file: subflows/open_equipment_module.yaml
    env:
      MODULE: "Cold equipments"
- assertVisible: "List of cold equipments and their temperature checks.*"
- assertVisible:
    id: "com.mycawan.haccp.preprod:id/tvTitleLabel"
- assertVisible: "Goal: "
- takeScreenshot: "screenshots/cold01_list"
