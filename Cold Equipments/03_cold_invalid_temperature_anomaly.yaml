# REGRESSION (non-conformity) - Cold equipment out of range -> "Invalid temperature",
# create the anomaly (product temp, becoming, cause, action), save and close it.
# DESTRUCTIVE: creates a closed anomaly on the equipment for the current time slot.
appId: com.mycawan.haccp.preprod
name: "COLD 03 - Cold invalid temperature + anomaly"
tags: [regression, negative, destructive, cold]
env:
  USER_NAME: ${USER_NAME || "Antoine.*GRIEZMANN"}
  USER_PIN: ${USER_PIN || "1234"}
  EQUIPMENT: ${EQUIPMENT || "FRIGO PERSO -1"}
  TEMP: ${TEMP || "9"}
  PRODUCT_TEMP: ${PRODUCT_TEMP || "6"}
  BECOMING: ${BECOMING || "Thrown"}
  CAUSE: ${CAUSE || "Porte mal fermée"}
  ACTION: ${ACTION || "Fermeture porte"}
---
- runFlow: subflows/login.yaml
- runFlow:
    file: subflows/open_equipment_module.yaml
    env:
      MODULE: "Cold equipments"
- runFlow: subflows/cold_open_equipment.yaml
- runFlow: subflows/cold_record_temperature.yaml
- extendedWaitUntil:
    visible: "Invalid temperature"
    timeout: 5000
- assertVisible: "An anomaly must be created"
- takeScreenshot: "screenshots/eq03_cold_invalid"
# The anomaly button exists only when the anomaly is not yet closed
- runFlow:
    when:
      visible: "Create the anomaly"
    file: subflows/cold_create_anomaly.yaml
- tapOn:
    id: "com.mycawan.haccp.preprod:id/llBackClick"
- tapOn:
    id: "com.mycawan.haccp.preprod:id/llBackClick"
    optional: true
- extendedWaitUntil:
    visible: "List of cold equipments.*"
    timeout: 8000
- scrollUntilVisible:
    element: ${EQUIPMENT}
- assertVisible:
    text: "Closed anomaly"
    below: ${EQUIPMENT}
