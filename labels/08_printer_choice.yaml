appId: com.mycawan.haccp.preprod
name: "LAB 08 - Printer choice without printers"
tags: [regression, labels]
env:
  USER_NAME: ${USER_NAME || "Antoine.*GRIEZMANN"}
  USER_PIN: ${USER_PIN || "1234"}
---
- runFlow: subflows/login.yaml
- runFlow: subflows/open_labels_module.yaml
- tapOn: "No printer"
- extendedWaitUntil:
    visible: "Printer choice"
    timeout: 5000
- assertVisible: "Choose the printer to use"
- assertVisible: "No choice available"
- takeScreenshot: "screenshots/LAB08_printer_choice"
- tapOn: "Close icon"
- extendedWaitUntil:
    notVisible: "Printer choice"
    timeout: 5000
