appId: com.mycawan.haccp.preprod
name: "LAB 03 - Search products"
tags: [smoke, regression, labels]
env:
  USER_NAME: ${USER_NAME || "Antoine.*GRIEZMANN"}
  USER_PIN: ${USER_PIN || "1234"}
---
- runFlow: subflows/login.yaml
- runFlow: subflows/open_labels_module.yaml
# Partial match
- runFlow:
    file: subflows/search_product.yaml
    env: {QUERY: "vin"}
- assertVisible: "Vin Blanc"
- assertVisible: "Vin Rouge"
- assertNotVisible: "Champignons"
# Accent-insensitive match
- runFlow:
    file: subflows/search_product.yaml
    env: {QUERY: "chevre"}
- assertVisible: ".*Chèvre frais"
# No result
- runFlow:
    file: subflows/search_product.yaml
    env: {QUERY: "zzqxw"}
- assertVisible: "No result for your search"
- takeScreenshot: "screenshots/LAB03_no_result"
# Erase restores the full list
- tapOn: "Erase"
- waitForAnimationToEnd
- assertVisible: "Champignons"
