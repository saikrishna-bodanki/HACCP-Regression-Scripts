appId: com.mycawan.haccp.preprod
name: "LAB 02 - Product / Production / INCO tabs"
tags: [regression, labels]
env:
  USER_NAME: ${USER_NAME || "Antoine.*GRIEZMANN"}
  USER_PIN: ${USER_PIN || "1234"}
---
- runFlow: subflows/login.yaml
- runFlow: subflows/open_labels_module.yaml
- tapOn: "Production"
- waitForAnimationToEnd
- assertNotVisible: "UBD : .*"        # product cards are only on the Product tab
- takeScreenshot: "screenshots/LAB02_production"
- tapOn: "INCO"
- waitForAnimationToEnd
- assertNotVisible: "UBD : .*"
- takeScreenshot: "screenshots/LAB02_inco"
- tapOn: "Product"
- extendedWaitUntil:
    visible: "UBD : .*"
    timeout: 8000
