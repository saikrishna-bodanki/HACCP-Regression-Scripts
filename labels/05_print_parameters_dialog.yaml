appId: com.mycawan.haccp.preprod
name: "LAB 05 - Print parameters dialog"
tags: [smoke, regression, labels]
env:
  USER_NAME: ${USER_NAME || "Antoine.*GRIEZMANN"}
  USER_PIN: ${USER_PIN || "1234"}
  PRODUCT: ${PRODUCT || "Champignons"}
---
- runFlow: subflows/login.yaml
- runFlow: subflows/open_labels_module.yaml
- runFlow: subflows/open_print_parameters.yaml
- assertVisible: "template image"
- assertVisible: "UBD \\(.*\\)"
- assertVisible: "No printer selected."
- assertVisible: "Cancel"
# Without a printer the label cannot be queued
- assertVisible:
    containsChild: "Add"
    enabled: false
# Copy counter: starts at 1, cannot go below 1, + increments
- assertVisible: "1"
- tapOn: {point: "76%,62%", label: "Copies minus"}
- assertVisible: "1"
- tapOn: {point: "88%,62%", label: "Copies plus"}
- assertVisible: "2"
- takeScreenshot: "screenshots/LAB05_print_parameters"
- tapOn: "Cancel"
- extendedWaitUntil:
    notVisible: "Parameters for the label to print"
    timeout: 5000
