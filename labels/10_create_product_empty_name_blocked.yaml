appId: com.mycawan.haccp.preprod
name: "LAB 10 - Empty product name is rejected"
tags: [regression, labels, known_bug]
env:
  USER_NAME: ${USER_NAME || "Antoine.*GRIEZMANN"}
  USER_PIN: ${USER_PIN || "1234"}
---
- runFlow: subflows/login.yaml
- runFlow: subflows/open_labels_module.yaml
# KNOWN BUG (06/11/2026): "Next" with an empty name opens "Use parameters" - this flow fails until fixed.
- tapOn: {point: "78%,32%", label: "Create product"}
- extendedWaitUntil: {visible: "Create a product", timeout: 5000}
- hideKeyboard
- tapOn: "Next"
- waitForAnimationToEnd
- takeScreenshot: "screenshots/LAB10_after_next_empty"
- runFlow:
    when:
      visible: "Use parameters"
    commands:
      - tapOn: "Cancel"         # never create the product
- assertVisible: "Create a product"
- assertNotVisible: "Use parameters"
- tapOn: "Cancel"
