appId: com.mycawan.haccp.preprod
name: "LAB 09 - Create product dialog cancel"
tags: [regression, labels]
env:
  USER_NAME: ${USER_NAME || "Antoine.*GRIEZMANN"}
  USER_PIN: ${USER_PIN || "1234"}
---
- runFlow: subflows/login.yaml
- runFlow: subflows/open_labels_module.yaml
- tapOn:
    point: "78%,32%"                  # "+" icon button (Product tab only)
    label: "Create product"
- extendedWaitUntil:
    visible: "Create a product"
    timeout: 5000
- assertVisible: "Type the product name to create"
- assertVisible: "Product name"
- assertVisible: "Next"
- hideKeyboard
- tapOn: "Cancel"
- extendedWaitUntil:
    notVisible: "Create a product"
    timeout: 5000
- assertVisible: "UBD : .*"
