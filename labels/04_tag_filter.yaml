appId: com.mycawan.haccp.preprod
name: "LAB 04 - Tag filter"
tags: [regression, labels]
env:
  USER_NAME: ${USER_NAME || "Antoine.*GRIEZMANN"}
  USER_PIN: ${USER_PIN || "1234"}
  TAG_1: ${TAG_1 || "beazzzzz"}
  TAG_1_PRODUCT: ${TAG_1_PRODUCT || "Ail"}
  TAG_2: ${TAG_2 || "Test lon sss"}
---
- runFlow: subflows/login.yaml
- runFlow: subflows/open_labels_module.yaml
- tapOn:
    point: "94%,32%"                  # filter icon button
    label: "Open tag filter"
- extendedWaitUntil:
    visible: "Available tags"
    timeout: 5000
- assertVisible: "Selected tags"
- assertVisible: "No tag selected"
- assertVisible: "At least 1"
- assertVisible: "All"
# One tag -> only its products
- tapOn: ${TAG_1}
- assertNotVisible: "No tag selected"
- tapOn: "icon close"
- waitForAnimationToEnd
- assertVisible: ${TAG_1_PRODUCT}
- assertNotVisible: "Champignons"
- takeScreenshot: "screenshots/LAB04_one_tag"
# Two tags + "All" -> nothing has both
- tapOn: {point: "94%,32%"}
- extendedWaitUntil: {visible: "Available tags", timeout: 5000}
- tapOn: ${TAG_2}
- tapOn: "All"
- tapOn: "icon close"
- waitForAnimationToEnd
- assertVisible: "No result for your search"
# Clear all tags -> full list back
- tapOn: {point: "94%,32%"}
- extendedWaitUntil: {visible: "Available tags", timeout: 5000}
- tapOn:
    point: "95%,87%"                  # "clear all" x next to Selected tags
    label: "Clear selected tags"
- assertVisible: "No tag selected"
- tapOn: "icon close"
- waitForAnimationToEnd
- assertVisible: "Champignons"
