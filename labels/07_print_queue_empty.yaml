appId: com.mycawan.haccp.preprod
name: "LAB 07 - Empty print queue"
tags: [regression, labels]
env:
  USER_NAME: ${USER_NAME || "Antoine.*GRIEZMANN"}
  USER_PIN: ${USER_PIN || "1234"}
---
- runFlow: subflows/login.yaml
- runFlow: subflows/open_labels_module.yaml
- tapOn: "Print"
- extendedWaitUntil:
    visible: "Print queue"
    timeout: 5000
- assertVisible: "No print in queue"
- assertVisible:
    containsChild: "Print"
    enabled: false
- takeScreenshot: "screenshots/LAB07_print_queue"
- tapOn: "Cancel"
- extendedWaitUntil:
    notVisible: "Print queue"
    timeout: 5000
