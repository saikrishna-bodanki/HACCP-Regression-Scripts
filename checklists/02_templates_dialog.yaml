appId: com.mycawan.haccp.preprod
name: "CHK 02 - Checklist templates dialog"
tags: [smoke, regression, checklists]
env:
  USER_NAME: ${USER_NAME || "Antoine.*GRIEZMANN"}
  USER_PIN: ${USER_PIN || "1234"}
  TEMPLATE: ${TEMPLATE || "Contrôle et sécurité des toilettes clients"}
---
- runFlow: subflows/login.yaml
- runFlow: subflows/open_checklists_module.yaml
- tapOn: "Add an operation"
- extendedWaitUntil:
    visible: "Checklist templates"
    timeout: 8000
- assertVisible: "Select the template to use."
- assertVisible: ${TEMPLATE}
- assertVisible: "Protocole sanitaire COVID-19"
- assertVisible: "Protocole Sanitaire Mai 2021"
- takeScreenshot: "screenshots/CHK02_templates"
- tapOn:
    point: "90%,6%"                   # close (x) icon of the dialog
    label: "Close templates"
- extendedWaitUntil:
    notVisible: "Checklist templates"
    timeout: 5000
- assertVisible: "List of checklists"
