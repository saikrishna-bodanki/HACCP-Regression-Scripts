appId: com.mycawan.haccp.preprod
name: "CHK 07 - Incomplete checklist cannot be validated"
tags: [regression, checklists, known_bug, destructive]
env:
  USER_NAME: ${USER_NAME || "Antoine.*GRIEZMANN"}
  USER_PIN: ${USER_PIN || "1234"}
  TEMPLATE: ${TEMPLATE || "Contrôle et sécurité des toilettes clients"}
---
- runFlow: subflows/login.yaml
- runFlow: subflows/open_checklists_module.yaml
# KNOWN BUG (06/11/2026): Validate is offered with unanswered items - this flow fails until fixed.
- runFlow: subflows/start_checklist.yaml
- runFlow:
    file: subflows/answer_item.yaml
    env: {SECTION: "Open à 10H00", ANSWER: "Yes"}
- tapOn: "Save"
- extendedWaitUntil: {visible: "Validate", timeout: 8000}
- tapOn: "Validate"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Is this checklist complete\\?"
    commands:
      - takeScreenshot: "screenshots/CHK07_bug_validate_offered"
      - tapOn: "Cancel"
      - runFlow: subflows/delete_open_checklist.yaml
      - assertTrue:
          condition: ${false}
          label: "BUG: validation offered while 3 of 4 items are unanswered"
- runFlow: subflows/delete_open_checklist.yaml
