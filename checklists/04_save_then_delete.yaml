appId: com.mycawan.haccp.preprod
name: "CHK 04 - Save in progress, then delete"
tags: [smoke, regression, checklists, destructive]
env:
  USER_NAME: ${USER_NAME || "Antoine.*GRIEZMANN"}
  USER_PIN: ${USER_PIN || "1234"}
  TEMPLATE: ${TEMPLATE || "Contrôle et sécurité des toilettes clients"}
---
- runFlow: subflows/login.yaml
- runFlow: subflows/open_checklists_module.yaml
- runFlow: subflows/start_checklist.yaml
- runFlow:
    file: subflows/answer_item.yaml
    env: {SECTION: "Open à 10H00", ANSWER: "Yes"}
- runFlow:
    file: subflows/answer_item.yaml
    env: {SECTION: "10H00 à 14H00", ANSWER: "No"}
- tapOn: "Save"
- extendedWaitUntil:
    visible: "Validate"
    timeout: 8000
- assertVisible: "Delete"
# Saved -> back has no warning, card shows "In progress"
- runFlow: subflows/back_to_list.yaml
- assertNotVisible: "Data not saved"
- assertVisible: "In progress"
- assertVisible: "50.0%"
- takeScreenshot: "screenshots/CHK04_in_progress_card"
# Reopen keeps the answers
- tapOn: "In progress"
- extendedWaitUntil:
    visible: "Creation date : .*"
    timeout: 8000
- assertVisible: "50.0%"
# Delete: cancel first, then confirm
- scrollUntilVisible: {element: "Delete", direction: DOWN, timeout: 8000}
- tapOn: "Delete"
- extendedWaitUntil: {visible: "Deletion", timeout: 5000}
- tapOn: {id: "com.mycawan.haccp.preprod:id/btnCancel"}
- assertVisible: "Creation date : .*"
- runFlow: subflows/delete_open_checklist.yaml
- assertNotVisible: "In progress"
