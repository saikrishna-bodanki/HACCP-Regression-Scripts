appId: com.mycawan.haccp.preprod
name: "CHK 03 - Form progress + unsaved-data guard"
tags: [regression, checklists]
env:
  USER_NAME: ${USER_NAME || "Antoine.*GRIEZMANN"}
  USER_PIN: ${USER_PIN || "1234"}
  TEMPLATE: ${TEMPLATE || "Contrôle et sécurité des toilettes clients"}
---
- runFlow: subflows/login.yaml
- runFlow: subflows/open_checklists_module.yaml
- runFlow: subflows/start_checklist.yaml
- assertVisible: "0.0%"
- assertVisible:
    containsChild: "Save"
    enabled: false                    # nothing answered yet
- runFlow:
    file: subflows/answer_item.yaml
    env: {SECTION: "Open à 10H00", ANSWER: "Yes"}
- runFlow:
    file: subflows/answer_item.yaml
    env: {SECTION: "10H00 à 14H00", ANSWER: "No"}
- assertVisible: "50.0%"              # 1 compliant / 1 not compliant
- assertNotVisible:
    containsChild: "Save"
    enabled: false
- runFlow:
    file: subflows/answer_item.yaml
    env: {SECTION: "14H00 à 18H00", ANSWER: "not evaluated"}
- assertVisible: "Your suggestions"
- assertVisible: "Your comments"
- takeScreenshot: "screenshots/CHK03_answers"
# Back -> warning -> Stay keeps the form
- runFlow:
    file: subflows/back_to_list.yaml
    env: {ON_UNSAVED: "Stay"}
- assertVisible: "Creation date : .*"
# Back -> warning -> Exit discards (nothing saved)
- runFlow:
    file: subflows/back_to_list.yaml
    env: {ON_UNSAVED: "Exit"}
- extendedWaitUntil:
    visible: "List of checklists"
    timeout: 8000
